<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steam 灯塔 · 在近万款游戏里捞出没人看见的那一款</title>
<meta name="description" content="随机盲盒发现冷门佳作，也可以用多款游戏加权检索相似作品——参考 SteamPeek 的思路，中文界面，更偏冷门。">
<meta name="theme-color" content="#070a0e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗼</text></svg>">
<link rel="preload" href="fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=2026-11-26-11521-5458683">
  <meta property="og:title" content="Steam 灯塔 · 找到没人注意到的那些游戏">
  <meta property="og:description" content="随机盲盒发现冷门佳作 + 多游戏加权相似检索（静态版，离线可跑）">
</head>
<body>
<div class="bg">
  <div class="bg-glow bg-glow-a"></div>
  <div class="bg-glow bg-glow-b"></div>
  <div class="bg-grid"></div>
</div>

<header class="topbar">
  <div class="brand">
    <svg class="beacon" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#4cc2ff" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#4cc2ff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M24 6 L31 16 L17 16 Z" fill="#4cc2ff"/>
      <rect x="20" y="16" width="8" height="20" rx="2" fill="#dbe8f4"/>
      <rect x="14" y="36" width="20" height="5" rx="2.5" fill="#8db3d3"/>
      <path class="beam" d="M31 12 L46 4 L46 20 Z" fill="url(#beamGrad)"/>
      <circle cx="24" cy="12" r="2.4" fill="#fff9d6"/>
    </svg>
    <div>
      <div class="brand-title">Steam 灯塔</div>
      <div class="brand-sub">照亮没人注意到的那些游戏</div>
    </div>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="random" role="tab">盲盒发现</button>
    <button class="tab" data-view="similar" role="tab">相似追踪</button>
  </nav>

  <div class="status-chip" id="corpusPill" title="本地语料库规模">
    <span class="dot"></span><span id="corpusText">载入中…</span>
  </div>
</header>

<main>
  <!-- ================= 盲盒发现 ================= -->
  <section class="view" id="view-random">
    <div class="view-head">
      <div>
        <h2>开灯，照一照深海</h2>
        <p>默认只捞「评测不多、但好评率很高」的隐藏佳作，一屏 33 款。</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="seg" id="modeSeg">
        <button class="seg-btn active" data-mode="hidden">隐藏佳作</button>
        <button class="seg-btn" data-mode="gem">好评小众</button>
        <button class="seg-btn" data-mode="fresh">这两年</button>
        <button class="seg-btn" data-mode="any">完全随机</button>
      </div>

      <div class="multisel" id="tagFilter">
        <button class="multisel-btn" id="tagBtn" aria-haspopup="listbox" aria-expanded="false">
          <span class="ms-label" id="tagBtnLabel">全部标签</span>
          <span class="ms-count" id="tagCount" hidden>0</span>
          <svg class="caret" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="multisel-panel" id="tagPanel" hidden>
          <div class="ms-head">
            <input id="tagSearch" type="text" placeholder="搜索标签（如 恐怖 / 农场）" autocomplete="off">
          </div>
          <div class="ms-list" id="tagList" role="listbox" aria-multiselectable="true"></div>
          <div class="ms-foot">
            <span class="ms-hint">选中多个 = 必须同时具备（AND）</span>
            <span class="ms-actions">
              <button class="btn btn-sm btn-quiet" id="tagClear">清空</button>
              <button class="btn btn-sm btn-primary" id="tagDone">完成</button>
            </span>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" id="rollBtn">换一批 <kbd>空格</kbd></button>
      <span class="pool-info" id="poolInfo"></span>
    </div>

    <div class="ms-chips" id="tagChips" hidden></div>

    <article class="hero" id="heroCard">
      <div class="skeleton-hero">
        <div class="sk" style="width:38%;height:14px"></div>
        <div class="sk" style="width:62%;height:40px"></div>
        <div class="sk" style="width:44%;height:22px"></div>
        <div class="sk" style="width:70%;height:34px"></div>
      </div>
    </article>

    <div class="section-bar">
      <h3>顺手再捞 <span id="gridCount">32</span> 款</h3>
      <div class="section-actions">
        <button class="btn btn-sm" id="shuffleGrid">换一次</button>
      </div>
    </div>
    <div class="grid" id="randomGrid"></div>

    <div class="section-bar" id="recentWrap" hidden>
      <h3>刚刚捞到</h3>
      <div class="section-actions"><button class="btn btn-sm btn-quiet" id="clearRecent">清空</button></div>
    </div>
    <div class="recent-strip" id="recentList" hidden></div>
  </section>

  <!-- ================= 相似追踪 ================= -->
  <section class="view hidden" id="view-similar">
    <div class="view-head">
      <div>
        <h2>顺着线索，摸出一串同类</h2>
        <p>放多款游戏，相似度会向它们的交集收敛；每款还能调权重——拉高它，结果就更像它。</p>
      </div>
    </div>

    <div class="search-dock">
      <div class="search-row">
        <div class="search-field">
          <span class="icon">🔍</span>
          <input id="seedInput" type="text" autocomplete="off" spellcheck="false"
                 placeholder="输入游戏名，比如 No Man's Sky / Stardew Valley / 饥荒…">
          <div class="dropdown" id="dropdown" hidden></div>
        </div>
        <button class="btn btn-primary" id="findBtn">找相似</button>
      </div>

      <div class="seeds" id="seedChips">
        <p class="seeds-empty">先加一两款游戏。加得越多，结果越靠向它们的共同点。</p>
      </div>

      <div class="sim-options">
        <label class="slider-label">
          最低评测数 <output id="minRevOut">0</output>
          <input type="range" id="minRev" min="0" max="20000" step="500" value="0">
        </label>
        <label class="chk"><input type="checkbox" id="onlyHidden"> 只看冷门（评测 &lt; 5000）</label>
      </div>
    </div>

    <div class="explain" id="explain" hidden></div>
    <div class="grid" id="results"></div>
    <div style="display:flex;justify-content:center;margin-top:22px">
      <button class="btn" id="loadMore" hidden>加载更多</button>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="foot-lines">
    <span>数据来自 Steam 商店公开接口 · 语料本地缓存，不走第三方站点</span>
    <span class="sep">·</span>
    <a href="https://store.steampowered.com/" target="_blank" rel="noreferrer">Steam 商店</a>
    <span class="sep">·</span>
    <button class="link" id="changelogBtn">更新日志</button>
    <span class="sep">·</span>
    <span>相似度 = Valve 官方标签权重 × IDF 余弦 + 交集收敛</span>
  </div>
  <a class="credit" href="https://github.com/OStonefishO" target="_blank" rel="noreferrer" title="OStonefishO">
    <img class="avatar" src="avatar.jpg" alt="OStonefishO" width="30" height="30">
    <span class="credit-text">make with <span class="heart">♥</span> love</span>
  </a>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-body" role="dialog" aria-modal="true">
    <button class="modal-close" data-close aria-label="关闭">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="tip" id="tip" hidden></div>

<script>window.LIGHTHOUSE_STATIC = true;</script>
<script src="local-api.js?v=2026-11-26-11521-5458683"></script>
<script src="app.js?v=2026-11-26-11521-5458683" type="module"></script>
</body>
</html>
